<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySecretsManager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .login-screen, .main-app {
            display: none;
        }

        .login-screen.active, .main-app.active {
            display: block;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-full {
            width: 100%;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .secrets-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .secret-card {
            background: var(--surface);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .secret-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .secret-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .secret-title {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .secret-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .category-password {
            background: #dbeafe;
            color: #1e40af;
        }

        .category-token {
            background: #fef3c7;
            color: #92400e;
        }

        .category-secret {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .category-custom {
            background: #e0f2fe;
            color: #075985;
        }

        .secret-field {
            margin-bottom: 8px;
            font-size: 13px;
        }

        .secret-field strong {
            color: var(--text-secondary);
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .secret-value {
            color: var(--text-primary);
            word-break: break-all;
        }

        .secret-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--background);
            color: var(--text-primary);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-bar {
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s;
        }

        .strength-weak {
            width: 33%;
            background: var(--danger-color);
        }

        .strength-medium {
            width: 66%;
            background: var(--warning-color);
        }

        .strength-strong {
            width: 100%;
            background: var(--success-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--surface);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .timestamp {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-style: italic;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 8px;
        }

        .password-generator {
            background: var(--background);
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .password-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .generated-password {
            background: white;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-top: 12px;
            border: 2px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {
                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .secrets-grid {
                grid-template-columns: 1fr;
            }

            .password-options {
                grid-template-columns: 1fr;
            }
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 MySecretsManager</h1>
            <p>Secure password and secrets management with AES-256 encryption</p>
        </div>

        <div class="content">
            <!-- Login Screen -->
            <div class="login-screen active">
                <div class="login-form">
                    <div id="loginAlert"></div>
                    <h2 style="margin-bottom: 24px; text-align: center;">Enter Master Password</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="masterPassword">Master Password</label>
                            <input type="password" id="masterPassword" required 
                                   placeholder="Enter your master password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">🔓 Unlock</button>
                    </form>
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                        <p style="text-align: center; color: var(--text-secondary); font-size: 13px; margin-bottom: 12px;">
                            Import existing secrets file
                        </p>
                        <div class="file-input-wrapper">
                            <button class="btn btn-secondary btn-full">📁 Import Secrets File</button>
                            <input type="file" id="importFileLogin" accept=".txt">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Application -->
            <div class="main-app">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <button class="btn btn-primary" id="addSecretBtn">➕ Add Secret</button>
                        <button class="btn btn-success" id="exportBtn">💾 Export</button>
                        <div class="file-input-wrapper" style="display: inline-block; width: auto;">
                            <button class="btn btn-secondary">📁 Import</button>
                            <input type="file" id="importFile" accept=".txt">
                        </div>
                        <button class="btn btn-danger" id="lockBtn">🔒 Lock</button>
                    </div>
                    <div class="toolbar-right">
                        <input type="text" id="searchBox" class="search-box" 
                               placeholder="🔍 Search secrets...">
                    </div>
                </div>

                <div class="filter-group" id="filterGroup">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="password">Passwords</button>
                    <button class="filter-btn" data-filter="token">Tokens</button>
                    <button class="filter-btn" data-filter="secret">Secrets</button>
                    <button class="filter-btn" data-filter="custom">Custom</button>
                </div>

                <div id="secretsContainer" style="margin-top: 24px;">
                    <!-- Secrets will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Secret Modal -->
    <div class="modal" id="secretModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Secret</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modalAlert"></div>
            <form id="secretForm">
                <input type="hidden" id="secretId">
                
                <div class="form-group">
                    <label for="secretCategory">Category</label>
                    <select id="secretCategory" required>
                        <option value="password">Password</option>
                        <option value="token">Token</option>
                        <option value="secret">Secret</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="secretName">Name / Title</label>
                    <input type="text" id="secretName" required 
                           placeholder="e.g., Gmail Account, GitHub Token">
                </div>

                <div class="form-group" id="usernameGroup">
                    <label for="secretUsername">Username / Email</label>
                    <input type="text" id="secretUsername" 
                           placeholder="Optional">
                </div>

                <div class="form-group" id="passwordGroup">
                    <label for="secretPassword">Password / Value</label>
                    <input type="text" id="secretPassword" required 
                           placeholder="Enter the secret value">
                    <div class="password-strength" id="passwordStrength"></div>
                    
                    <div class="password-generator">
                        <label style="margin-bottom: 12px;">Password Generator</label>
                        <div class="password-options">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="passwordLength">Length: <span id="lengthValue">16</span></label>
                                <input type="range" id="passwordLength" min="8" max="64" value="16" 
                                       style="width: 100%;">
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="includeUppercase" checked>
                                    <label for="includeUppercase" style="margin: 0;">Uppercase</label>
                                </div>
                                <div class="checkbox-group">
                                    <input type="checkbox" id="includeLowercase" checked>
                                    <label for="includeLowercase" style="margin: 0;">Lowercase</label>
                                </div>
                            </div>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="includeNumbers" checked>
                                    <label for="includeNumbers" style="margin: 0;">Numbers</label>
                                </div>
                                <div class="checkbox-group">
                                    <input type="checkbox" id="includeSymbols" checked>
                                    <label for="includeSymbols" style="margin: 0;">Symbols</label>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-full" 
                                onclick="generatePassword()">🎲 Generate Password</button>
                    </div>
                </div>

                <div class="form-group" id="urlGroup">
                    <label for="secretUrl">URL / Website</label>
                    <input type="url" id="secretUrl" 
                           placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label for="secretNotes">Notes</label>
                    <textarea id="secretNotes" 
                              placeholder="Additional notes or information"></textarea>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        💾 Save Secret
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Encryption/Decryption utilities using Web Crypto API
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                'PBKDF2',
                false,
                ['deriveBits', 'deriveKey']
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(plaintext, password) {
            const enc = new TextEncoder();
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            
            const encrypted = await window.crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                enc.encode(plaintext)
            );
            
            // Combine salt + iv + encrypted data
            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);
            
            // Convert to base64
            return btoa(String.fromCharCode.apply(null, combined));
        }

        async function decryptData(ciphertext, password) {
            try {
                // Decode from base64
                const combined = Uint8Array.from(atob(ciphertext), c => c.charCodeAt(0));
                
                // Extract salt, iv, and encrypted data
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const encrypted = combined.slice(28);
                
                const key = await deriveKey(password, salt);
                
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    encrypted
                );
                
                const dec = new TextDecoder();
                return dec.decode(decrypted);
            } catch (error) {
                return null;
            }
        }

        // Global state
        let masterPassword = '';
        let secrets = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let editingId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Login form
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            
            // Import on login screen
            document.getElementById('importFileLogin').addEventListener('change', handleImportLogin);
            
            // Main app buttons
            document.getElementById('addSecretBtn').addEventListener('click', openAddModal);
            document.getElementById('exportBtn').addEventListener('click', exportSecrets);
            document.getElementById('importFile').addEventListener('change', handleImport);
            document.getElementById('lockBtn').addEventListener('click', lockApp);
            document.getElementById('searchBox').addEventListener('input', handleSearch);
            
            // Secret form
            document.getElementById('secretForm').addEventListener('submit', handleSecretSubmit);
            document.getElementById('secretCategory').addEventListener('change', updateFormFields);
            document.getElementById('secretPassword').addEventListener('input', checkPasswordStrength);
            document.getElementById('passwordLength').addEventListener('input', function() {
                document.getElementById('lengthValue').textContent = this.value;
            });
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderSecrets();
                });
            });
            
            // Close modal on background click
            document.getElementById('secretModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Try to load from localStorage
            const savedData = localStorage.getItem('mySecretsManagerData');
            if (savedData) {
                // Data exists, user needs to unlock
                console.log('Saved data found, waiting for password');
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('masterPassword').value;
            
            if (!password) {
                showLoginAlert('Please enter a master password', 'error');
                return;
            }

            const savedData = localStorage.getItem('mySecretsManagerData');
            
            if (savedData) {
                // Try to decrypt existing data
                try {
                    const decrypted = await decryptData(savedData, password);
                    if (!decrypted) {
                        showLoginAlert('Incorrect password', 'error');
                        return;
                    }
                    const data = JSON.parse(decrypted);
                    secrets = data.secrets || [];
                    masterPassword = password;
                    showMainApp();
                } catch (error) {
                    showLoginAlert('Incorrect password or corrupted data', 'error');
                }
            } else {
                // New user, just set the password
                masterPassword = password;
                secrets = [];
                showMainApp();
            }
        }

        function handleImportLogin(e) {
            const file = e.target.files[0];
            if (!file) return;

            const password = document.getElementById('masterPassword').value;
            if (!password) {
                showLoginAlert('Please enter your master password first', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const encrypted = event.target.result;
                    const decrypted = await decryptData(encrypted, password);
                    
                    if (!decrypted) {
                        showLoginAlert('Incorrect password or invalid file', 'error');
                        return;
                    }

                    const data = JSON.parse(decrypted);
                    secrets = data.secrets || [];
                    masterPassword = password;
                    
                    // Save to localStorage
                    await saveData();
                    
                    showMainApp();
                    showAlert('Secrets imported successfully!', 'success');
                } catch (error) {
                    showLoginAlert('Failed to import file: ' + error.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function showLoginAlert(message, type) {
            const alertDiv = document.getElementById('loginAlert');
            alertDiv.innerHTML = `<div class="alert alert-${type === 'error' ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        function showMainApp() {
            document.querySelector('.login-screen').classList.remove('active');
            document.querySelector('.main-app').classList.add('active');
            renderSecrets();
        }

        async function lockApp() {
            if (confirm('Are you sure you want to lock the application?')) {
                await saveData();
                masterPassword = '';
                secrets = [];
                currentFilter = 'all';
                currentSearch = '';
                document.getElementById('masterPassword').value = '';
                document.querySelector('.main-app').classList.remove('active');
                document.querySelector('.login-screen').classList.add('active');
            }
        }

        async function saveData() {
            const data = {
                secrets: secrets,
                lastModified: new Date().toISOString()
            };
            const encrypted = await encryptData(JSON.stringify(data), masterPassword);
            localStorage.setItem('mySecretsManagerData', encrypted);
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Secret';
            document.getElementById('secretForm').reset();
            document.getElementById('secretId').value = '';
            document.getElementById('modalAlert').innerHTML = '';
            updateFormFields();
            document.getElementById('secretModal').classList.add('active');
        }

        function openEditModal(id) {
            const secret = secrets.find(s => s.id === id);
            if (!secret) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Secret';
            document.getElementById('secretId').value = id;
            document.getElementById('secretCategory').value = secret.category;
            document.getElementById('secretName').value = secret.name;
            document.getElementById('secretUsername').value = secret.username || '';
            document.getElementById('secretPassword').value = secret.password || secret.value || '';
            document.getElementById('secretUrl').value = secret.url || '';
            document.getElementById('secretNotes').value = secret.notes || '';
            document.getElementById('modalAlert').innerHTML = '';
            updateFormFields();
            checkPasswordStrength();
            document.getElementById('secretModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('secretModal').classList.remove('active');
            editingId = null;
        }

        function updateFormFields() {
            const category = document.getElementById('secretCategory').value;
            const usernameGroup = document.getElementById('usernameGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            const urlGroup = document.getElementById('urlGroup');
            const passwordLabel = passwordGroup.querySelector('label');

            // Show/hide fields based on category
            if (category === 'password') {
                usernameGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                passwordLabel.textContent = 'Password';
            } else if (category === 'token') {
                usernameGroup.style.display = 'none';
                urlGroup.style.display = 'block';
                passwordLabel.textContent = 'Token Value';
            } else if (category === 'secret') {
                usernameGroup.style.display = 'none';
                urlGroup.style.display = 'none';
                passwordLabel.textContent = 'Secret Value';
            } else {
                usernameGroup.style.display = 'block';
                urlGroup.style.display = 'block';
                passwordLabel.textContent = 'Value';
            }
        }

        async function handleSecretSubmit(e) {
            e.preventDefault();

            const secretData = {
                id: editingId || Date.now().toString(),
                category: document.getElementById('secretCategory').value,
                name: document.getElementById('secretName').value,
                username: document.getElementById('secretUsername').value,
                password: document.getElementById('secretPassword').value,
                url: document.getElementById('secretUrl').value,
                notes: document.getElementById('secretNotes').value,
                created: editingId ? secrets.find(s => s.id === editingId).created : new Date().toISOString(),
                modified: new Date().toISOString()
            };

            if (editingId) {
                const index = secrets.findIndex(s => s.id === editingId);
                secrets[index] = secretData;
                showAlert('Secret updated successfully!', 'success');
            } else {
                secrets.push(secretData);
                showAlert('Secret added successfully!', 'success');
            }

            await saveData();
            renderSecrets();
            closeModal();
        }

        async function deleteSecret(id) {
            if (confirm('Are you sure you want to delete this secret? This action cannot be undone.')) {
                secrets = secrets.filter(s => s.id !== id);
                await saveData();
                renderSecrets();
                showAlert('Secret deleted successfully!', 'success');
            }
        }

        function copyToClipboard(text, fieldName) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert(`${fieldName} copied to clipboard!`, 'success');
            }).catch(err => {
                showAlert('Failed to copy to clipboard', 'error');
            });
        }

        function renderSecrets() {
            const container = document.getElementById('secretsContainer');
            let filteredSecrets = secrets;

            // Apply filter
            if (currentFilter !== 'all') {
                filteredSecrets = filteredSecrets.filter(s => s.category === currentFilter);
            }

            // Apply search
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filteredSecrets = filteredSecrets.filter(s => 
                    s.name.toLowerCase().includes(search) ||
                    (s.username && s.username.toLowerCase().includes(search)) ||
                    (s.url && s.url.toLowerCase().includes(search)) ||
                    (s.notes && s.notes.toLowerCase().includes(search))
                );
            }

            if (filteredSecrets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <h3>No secrets found</h3>
                        <p>${currentSearch ? 'Try a different search term' : 'Click "Add Secret" to get started'}</p>
                    </div>
                `;
                return;
            }

            const html = `
                <div class="secrets-grid">
                    ${filteredSecrets.map(secret => `
                        <div class="secret-card" data-secret-id="${secret.id}">
                            <div class="secret-header">
                                <div>
                                    <span class="secret-category category-${secret.category}">${secret.category}</span>
                                    <div class="secret-title">${escapeHtml(secret.name)}</div>
                                </div>
                            </div>
                            
                            ${secret.username ? `
                                <div class="secret-field">
                                    <strong>Username:</strong>
                                    <span class="secret-value">${escapeHtml(secret.username)}</span>
                                </div>
                            ` : ''}
                            
                            <div class="secret-field">
                                <strong>${secret.category === 'token' ? 'Token' : secret.category === 'password' ? 'Password' : 'Value'}:</strong>
                                <span class="secret-value">••••••••</span>
                            </div>
                            
                            ${secret.url ? `
                                <div class="secret-field">
                                    <strong>URL:</strong>
                                    <span class="secret-value">${escapeHtml(secret.url)}</span>
                                </div>
                            ` : ''}
                            
                            ${secret.notes ? `
                                <div class="secret-field">
                                    <strong>Notes:</strong>
                                    <span class="secret-value">${escapeHtml(secret.notes.substring(0, 100))}${secret.notes.length > 100 ? '...' : ''}</span>
                                </div>
                            ` : ''}
                            
                            <div class="timestamp">
                                Modified: ${new Date(secret.modified).toLocaleString()}
                            </div>
                            
                            <div class="secret-actions">
                                <button class="btn btn-sm btn-primary btn-copy" data-field-name="${secret.category === 'token' ? 'Token' : 'Password'}">
                                    📋 Copy
                                </button>
                                <button class="btn btn-sm btn-secondary btn-edit">
                                    ✏️ Edit
                                </button>
                                <button class="btn btn-sm btn-danger btn-delete">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = html;
            
            // Add event delegation for buttons
            container.addEventListener('click', handleSecretCardClick);
        }
        
        function handleSecretCardClick(e) {
            const card = e.target.closest('.secret-card');
            if (!card) return;
            
            const secretId = card.dataset.secretId;
            const secret = secrets.find(s => s.id === secretId);
            if (!secret) return;
            
            if (e.target.classList.contains('btn-copy')) {
                const fieldName = e.target.dataset.fieldName;
                copyToClipboard(secret.password, fieldName);
            } else if (e.target.classList.contains('btn-edit')) {
                openEditModal(secretId);
            } else if (e.target.classList.contains('btn-delete')) {
                deleteSecret(secretId);
            }
        }

        function handleSearch(e) {
            currentSearch = e.target.value;
            renderSecrets();
        }

        async function exportSecrets() {
            if (secrets.length === 0) {
                showAlert('No secrets to export', 'error');
                return;
            }

            const data = {
                secrets: secrets,
                exported: new Date().toISOString()
            };

            const encrypted = await encryptData(JSON.stringify(data), masterPassword);
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);
            const filename = `secrets-backup-${timestamp}.txt`;

            const blob = new Blob([encrypted], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            showAlert('Secrets exported successfully!', 'success');
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!confirm('Importing will merge with your existing secrets. Continue?')) {
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const encrypted = event.target.result;
                    const decrypted = await decryptData(encrypted, masterPassword);
                    
                    if (!decrypted) {
                        showAlert('Failed to decrypt file. Wrong password?', 'error');
                        return;
                    }

                    const data = JSON.parse(decrypted);
                    const importedSecrets = data.secrets || [];

                    // Merge secrets (avoid duplicates by ID)
                    importedSecrets.forEach(importedSecret => {
                        const existingIndex = secrets.findIndex(s => s.id === importedSecret.id);
                        if (existingIndex >= 0) {
                            // Update existing
                            secrets[existingIndex] = importedSecret;
                        } else {
                            // Add new
                            secrets.push(importedSecret);
                        }
                    });

                    await saveData();
                    renderSecrets();
                    showAlert(`Successfully imported ${importedSecrets.length} secrets!`, 'success');
                } catch (error) {
                    showAlert('Failed to import file: ' + error.message, 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const includeUppercase = document.getElementById('includeUppercase').checked;
            const includeLowercase = document.getElementById('includeLowercase').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;

            let chars = '';
            if (includeUppercase) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (includeLowercase) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (includeNumbers) chars += '0123456789';
            if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                showModalAlert('Please select at least one character type', 'error');
                return;
            }

            let password = '';
            const charsArray = new Uint32Array(length);
            window.crypto.getRandomValues(charsArray);
            
            for (let i = 0; i < length; i++) {
                password += chars.charAt(charsArray[i] % chars.length);
            }

            document.getElementById('secretPassword').value = password;
            checkPasswordStrength();
        }

        function checkPasswordStrength() {
            const password = document.getElementById('secretPassword').value;
            const strengthDiv = document.getElementById('passwordStrength');

            if (!password) {
                strengthDiv.innerHTML = '';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            let label, className;
            if (strength <= 2) {
                label = 'Weak';
                className = 'strength-weak';
            } else if (strength <= 4) {
                label = 'Medium';
                className = 'strength-medium';
            } else {
                label = 'Strong';
                className = 'strength-strong';
            }

            strengthDiv.innerHTML = `
                <div>Strength: <strong>${label}</strong></div>
                <div class="strength-bar">
                    <div class="strength-fill ${className}"></div>
                </div>
            `;
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '2000';
            alertDiv.style.minWidth = '300px';
            alertDiv.style.boxShadow = 'var(--shadow-lg)';
            
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.style.opacity = '0';
                alertDiv.style.transition = 'opacity 0.3s';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);
        }

        function showModalAlert(message, type) {
            const alertDiv = document.getElementById('modalAlert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
